<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Juguetería El Osito</title>
    <meta name="description" content="Consulta las estadísticas de rendimiento, ingresos totales, ventas realizadas y balance general de stock en Juguetería El Osito.">
    <link rel="canonical" href="https://tusitio.com/vistas/estadisticas.html">
    <meta property="og:title" content="Estadísticas - Juguetería El Osito">
    <meta property="og:description" content="Consulta las estadísticas de rendimiento, ingresos y control general en Juguetería El Osito.">
    <meta property="og:type" content="website">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #93c5fd 100%);
            min-height: 100vh;
        }

        a:focus-visible, button:focus-visible {
            outline: 3px solid #ffc107 !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body class="text-dark d-flex flex-column">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" role="navigation" aria-label="Navegación principal">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span class="fs-4" aria-hidden="true">🧸</span> <span>Juguetería El Osito</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-1 text-end text-lg-start">
                    <li class="nav-item"><a class="nav-link text-white-50 px-3 py-2 fw-semibold" href="../index.html"><i class="bi bi-house-door me-1" aria-hidden="true"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50 px-3 py-2 fw-semibold" href="./juguetes.html"><i class="bi bi-controller me-1" aria-hidden="true"></i> Juguetes</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50 px-3 py-2 fw-semibold" href="./vendedores.html"><i class="bi bi-people me-1" aria-hidden="true"></i> Vendedores</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50 px-3 py-2 fw-semibold" href="./ventas.html"><i class="bi bi-cart-check me-1" aria-hidden="true"></i> Ventas</a></li>
                    <li class="nav-item"><a class="nav-link active bg-primary text-white rounded px-3 py-2 fw-semibold" href="./estadisticas.html" aria-current="page"><i class="bi bi-bar-chart-fill me-1" aria-hidden="true"></i> Estadísticas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4 flex-grow-1" id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h4 fw-bold text-white mb-1 shadow-sm">Panel de Estadísticas</h1>
                <p class="text-white fs-6 mb-0 opacity-75">Resumen de rendimiento del negocio.</p>
            </div>
            <button id="btn-actualizar-stats" class="btn btn-light fw-bold shadow-sm" aria-label="Actualizar los datos de las estadísticas">
                <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i> Actualizar Datos
            </button>
        </div>
        
        <div class="row g-4" id="contenedor-stats">
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-4 p-4 bg-white border-top border-success border-4 h-100">
                    <span class="text-muted fw-bold small text-uppercase">Ingresos Totales</span>
                    <h2 class="fw-bold text-success mt-2 mb-0">
                        <span id="stat-ingresos" aria-live="polite">$0.00</span>
                    </h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-4 p-4 bg-white border-top border-primary border-4 h-100">
                    <span class="text-muted fw-bold small text-uppercase">Ventas Realizadas</span>
                    <h2 class="fw-bold text-primary mt-2 mb-0">
                        <span id="stat-ventas" aria-live="polite">0</span>
                    </h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-4 p-4 bg-white border-top border-warning border-4 h-100">
                    <span class="text-muted fw-bold small text-uppercase">Stock Total</span>
                    <h2 class="fw-bold text-warning-emphasis mt-2 mb-0">
                        <span id="stat-stock" aria-live="polite">0</span>
                    </h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4 p-4 bg-white border-top border-info border-4 h-100">
                    <span class="text-muted fw-bold small text-uppercase">Tipos de Juguetes</span>
                    <h2 class="fw-bold text-info mt-2 mb-0">
                        <span id="stat-juguetes" aria-live="polite">0</span>
                    </h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4 p-4 bg-white border-top border-secondary border-4 h-100">
                    <span class="text-muted fw-bold small text-uppercase">Vendedores Activos</span>
                    <h2 class="fw-bold text-secondary mt-2 mb-0">
                        <span id="stat-vendedores" aria-live="polite">0</span>
                    </h2>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import '../src/app.js';
        import { EstadisticaController } from '../src/controllers/estadisticaController.js';
        new EstadisticaController();
    </script>
</body>
</html>
