<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juguetes</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body onload="CargarDatosJuguetes()">
    <header class="encabezado">
        <h1>Juguetería El Osito</h1>
        <nav class="menu">
            <a href="./principal.html">Principal</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./ventas.html">Ventas</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2 class="titulo">ABM Juguetes</h2>

            <form>
                <div class="campos">
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo">

                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre">

                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" min="0">

                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" min="0">
                </div>

                <div class="botones">
                    <input class="boton btn_agregar" type="button" value="Agregar" onclick="AgregarJuguete()">
                    <input class="boton btn_modificar" type="button" value="Modificar" onclick="ModificarJuguete()">
                    <input class="boton btn_eliminar" type="button" value="Eliminar" onclick="EliminarJuguete()">
                    <input class="boton btn_limpiar" type="button" value="Limpiar" onclick="InicializarJuguete()">
                </div>
            </form>
        </section>

        <section class="tarjeta listado">
            <h2 class="titulo">Listado de juguetes</h2>
            <select id="lista-juguetes" onchange="SeleccionarJuguete()" size="6"></select>
        </section>
    </main>

    <script src="./dominio/juguete.js"></script>
    <script src="./dominio/memoria.js"></script>
    <script src="./dominio/jugueteria.js"></script>
</body>
</html>
